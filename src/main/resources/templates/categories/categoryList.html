<html xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout (~{::body},'categories')}">

<body>

<h2>Categories</h2>

<a sec:authorize="hasRole('ADMIN')" th:href="@{/categories/new}" class="btn btn-primary mb-3">
  <span class="fa fa-plus"></span> Add Category
</a>

<table class="table table-striped">
  <tbody>
  <tr th:each="cat : ${categories}">
    <td th:text="${cat.name}">Category Name</td>
    <td>
      <a th:href="@{/categories/{id}/edit(id=${cat.id})}"
         class="btn btn-sm btn-warning">Edit</a>

      <a th:href="@{/categories/{id}/delete(id=${cat.id})}"
         class="btn btn-sm btn-danger"
         onclick="return confirm('Are you sure?')">Delete</a>
    </td>
  </tr>
  </tbody>
</table>

</body>
</html>
