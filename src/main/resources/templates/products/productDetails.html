<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body},'products')}">

<body>

<head>
  <title>Product Details</title>
  <meta charset="UTF-8"/>
  <link rel="stylesheet" th:href="@{/css/petclinic.css}">

</head>


<body>
<div class="details-card">
  <h2 th:text="${product.name}">Product Name</h2>

  <div class="detail-row">
    <span class="detail-label">Domain:</span>
    <span th:text="${product.domain}"></span>
  </div>

  <div class="detail-row">
    <span class="detail-label">Category:</span>
    <span th:text="${product.category.name}"></span>
  </div>

  <div class="detail-row">
    <span class="detail-label">Quantity:</span>
    <span th:text="${product.quantity}"></span>
  </div>

  <div class="detail-row">
    <span class="detail-label">Price:</span>
    <span>$<span th:text="${product.price}"></span></span>
  </div>

  <div class="actions">
    <a th:href="@{/products}" class="btn">Back to Product List</a>
  </div>
</div>
</body>

<h2 class="text-center">Welcome to <span th:text="${product.name}">Product Name</span></h2>

<div class="container mt-4">

  <div class="alert alert-info">
    <h4 class="alert-heading">Coming Soon!</h4>
    <p>Upcoming leagues, intramural events, and registration for
      <strong th:text="${product.name}">this product</strong> will appear here shortly.
    </p>
  </div>

</div>

</body>
</html>
