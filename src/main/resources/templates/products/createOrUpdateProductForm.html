<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body},'product')}">
<body>

<h2 th:text="${product.id == null} ? 'Add Product' : 'Edit Product'">Product</h2>

<form th:object="${product}" method="post"
      th:action="${product.id == null} ? @{/products/new} : @{/products/{id}/edit(id=${product.id})}"
      class="form-horizontal">

  <input type="hidden" th:field="*{id}" />

  <input th:replace="~{fragments/inputField :: input ('Name', 'name', 'text')}" />
  <input th:replace="~{fragments/inputField :: input ('Domain', 'domain', 'text')}" />
  <input th:replace="~{fragments/inputField :: input ('Price', 'price', 'text')}" />
  <input th:replace="~{fragments/inputField :: input ('Quantity', 'quantity', 'text')}" />

  <div class="form-group">
    <label class="col-sm-2 control-label">Category</label>
    <div class="col-sm-10">
      <select th:field="*{productCategory}" class="form-control">
        <option value="">-- Select a Category --</option>
        <option th:each="cat : ${categories}"
                th:value="${cat.id}"
                th:text="${cat.name}">Category</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <div class="col-sm-offset-2 col-sm-10">
      <button class="btn btn-primary" type="submit"
              th:text="${product.id == null} ? 'Save Product' : 'Update Product'">
        Submit
      </button>
    </div>
  </div>
</form>

</body>
</html>
